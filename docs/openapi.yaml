                        type: string
                        format: date
                        description: Calendar date, YYYY-MM-DD.
                      deadline:
                        type: string
                        format: date-time
                        description: The earliest deadline among the linked papers.
                      locked:
                        type: boolean
                        description: True once the deadline has passed. Nothing can change.
