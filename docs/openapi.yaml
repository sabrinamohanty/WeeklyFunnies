        - scene
        - caption
        - dialogue
        - characters
        - sources
        - imageUrl
        - image
        - photos
      additionalProperties: false
    DialogueLine:
      type: object
      properties:
        speaker:
          type: string
          description: Display name to render in the bubble.
        speakerUserId:
          type: string
          format: uuid
        text:
          type: string
          description: At most 12 words. Rendered by the client as an overlaid bubble.
        side:
          type: string
          enum:
            - left
            - right
      required:
        - speaker
        - speakerUserId
        - text
        - side
      additionalProperties: false
    PanelImage:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/GenerationStatus"
        url:
          type:
            - string
            - "null"
          format: uri
          description: Short-lived signed URL. Do not cache past urlsExpireAt.
        error:
          $ref: "#/components/schemas/GenerationError"
      required:
        - status
        - url
        - error
      additionalProperties: false
      description: Show a loading state while pending or generating, and a retry on failed.
    GenerationStatus:
      type: string
      enum:
        - pending
        - generating
        - ready
        - failed
    GenerationError:
      type:
        - string
        - "null"
      enum:
        - generation_failed
        - content_blocked
        - provider_unavailable
        - null
    StoryNotice:
      type: string
      enum:
        - fallback_used
        - stale
      description: "fallback_used: generation failed validation, so safe default text was used; edit or regenerate. stale: approved highlights changed after the story was generated; regenerate before publishing."
    Weather:
      type:
        - object
        - "null"
      properties:
        city:
          type: string
        timezone:
          type: string
        fetchedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp.
        days:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Calendar date, YYYY-MM-DD.
              tempMaxC:
                type: number
              tempMinC:
                type: number
              precipitationChance:
                type:
                  - integer
                  - "null"
                minimum: 0
                maximum: 100
              weatherCode:
                type: integer
                description: WMO weather interpretation code.
              summary:
                type: string
                description: Short label for the code, e.g. 'Light rain'.
            required:
              - date
              - tempMaxC
              - tempMinC
              - precipitationChance
              - weatherCode
              - summary
            additionalProperties: false
          maxItems: 7
      required:
        - city
        - timezone
        - fetchedAt
        - days
      additionalProperties: false
      description: 7-day forecast for the reader's own city.
    ReorderRequest:
      type: object
      properties:
        highlightIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 3
          description: All of the caller's highlight ids in this edition, in the new order.
      required:
        - highlightIds
      additionalProperties: false
    Story:
      type: object
      properties:
        editionId:
          type: string
          format: uuid
        article:
          type: object
          properties:
            headline:
              type: string
            byline:
              type: string
              description: One of the members' names.
            bylineUserId:
              type: string
              format: uuid
            body:
              type: string
              description: 3 to 5 short paragraphs separated by a blank line.
          required:
            - headline
            - byline
            - bylineUserId
            - body
          additionalProperties: false
        comic:
          type:
            - object
            - "null"
          properties:
            title:
              type: string
            panels:
              type: array
              items:
                $ref: "#/components/schemas/StoryPanel"
          required:
            - title
            - panels
          additionalProperties: false
          description: Null when no approved highlight is eligible for the comic (all serious).
        notices:
          type: array
          items:
            $ref: "#/components/schemas/StoryNotice"
        regenerationsLeft:
          type: integer
          minimum: 0
        generatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp.
      required:
        - editionId
        - article
        - comic
        - notices
        - regenerationsLeft
        - generatedAt
      additionalProperties: false
    GenerateStoryRequest:
      type: object
      properties:
        editionId:
          type: string
          format: uuid
        people:
          type: array
          items:
            $ref: "#/components/schemas/PersonRef"
          maxItems: 8
          description: Optional. Every id must be a member of the edition's paper.
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/HighlightRef"
          maxItems: 24
          description: Optional. Every personId must be a member; every id must be a highlight in this edition.
        regenerate:
          type: boolean
          default: false
          description: Write a new story even if one exists. Resets every panel image. Limited per edition.
      required:
        - editionId
      additionalProperties: false
    PersonRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        look:
          type: string
          maxLength: 400
      required:
        - id
      additionalProperties: false
    HighlightRef:
      type: object
      properties:
        personId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 4000
          description: Ignored. The stored text is used.
      required:
        - personId
      additionalProperties: false
    UpdateStoryRequest:
      type: object
      properties:
        editionId:
          type: string
          format: uuid
        headline:
          type: string
          minLength: 1
          maxLength: 120
          description: Plain text, 1 to 120 characters after cleaning.
        body:
          type: string
          minLength: 1
          maxLength: 1500
          description: Plain text, 1 to 1500 characters after cleaning.
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Plain text, 1 to 80 characters after cleaning.
        panels:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
                maximum: 3
              caption:
                type:
                  - string
                  - "null"
                minLength: 1
                maxLength: 120
                description: Caption. At most 15 words. Plain text, 1 to 120 characters after cleaning.
              dialogue:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                      minLength: 1
                      maxLength: 100
                      description: Dialogue line. At most 12 words. Plain text, 1 to 100 characters after cleaning.
                  required:
                    - text
                  additionalProperties: false
                maxItems: 2
                description: Replaces the text of the existing lines in order; speakers and sides are kept.
            required:
              - index
            additionalProperties: false
          maxItems: 4
      required:
        - editionId
      additionalProperties: false
      description: Owner edits. Edited text is moderated. Draft editions only.
    GeneratePanelResponse:
      type: object
      properties:
        imageUrl:
          type: string
          format: uri
          description: Short-lived signed URL. Do not cache past urlsExpireAt.
        editionId:
          type: string
          format: uuid
        index:
          type: integer
          minimum: 0
          maximum: 3
        status:
          type: string
          enum:
            - ready
      required:
        - imageUrl
        - editionId
        - index
        - status
      additionalProperties: false
    GeneratePanelRequest:
      type: object
      properties:
        editionId:
          type: string
          format: uuid
        index:
          type: integer
          minimum: 0
          maximum: 3
          description: Which panel of the stored story to draw.
        style:
          type: string
          enum:
            - classic
            - manga
            - sketch
            - superhero
          description: If sent, must equal the paper's style.
        panel:
          type: object
          properties:
            scene:
              type: string
              maxLength: 1000
            caption:
              type:
                - string
                - "null"
              maxLength: 400
            dialogue:
              type: array
              items: {}
              maxItems: 2
            characters:
              type: array
              items:
                type: string
                format: uuid
              maxItems: 2
          required:
            - scene
          additionalProperties: false
          description: Optional echo of the panel. If sent, scene and characters must match the stored story; the stored panel is always what gets drawn.
        people:
          type: array
          items:
            $ref: "#/components/schemas/PersonRef"
          maxItems: 8
          description: Optional. Ids must be members.
        regenerate:
          type: boolean
          default: false
          description: Draw a new image even if one is ready. Counts toward the per-edition and daily caps.
      required:
        - editionId
        - index
      additionalProperties: false
    CreateHighlightRequest:
      type: object
      properties:
        editionId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: The highlight, in the author's words. Plain text, 1 to 500 characters after cleaning.
        serious:
          type: boolean
          default: false
      required:
        - editionId
        - text
      additionalProperties: false
    UpdateHighlightRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: The highlight, in the author's words. Plain text, 1 to 500 characters after cleaning.
        serious:
          type: boolean
        inComic:
          type: boolean
        approved:
          type: boolean
      additionalProperties: false
      description: Editing text, serious, or inComic clears approval unless approved=true is sent too.
    Deleted:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deleted:
          type: boolean
          enum:
            - true
      required:
        - id
        - deleted
      additionalProperties: false
    PhotoUpload:
      type: object
      properties:
        photo:
          type: string
          format: binary
          description: JPEG or PNG, at most 12 MB. Moderated, re-encoded server-side; all metadata is stripped.
      additionalProperties: false
    LogoutResult:
      type: object
      properties:
        signedOut:
          type: boolean
          enum:
            - true
          description: All sessions on all devices were revoked.
        purgeAfter:
          type: string
          format: date-time
          description: Draft posts are hidden now and deleted after this time unless the user signs back in. Posts in published editions follow the edition's expiry instead.
      required:
        - signedOut
        - purgeAfter
      additionalProperties: false
    CronResult:
      type: object
      properties:
        processed:
          type: integer
          minimum: 0
      required:
        - processed
      additionalProperties: false
  parameters: {}
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness check.
      tags:
        - system
      security: []
      x-phase: 0
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/me:
    get:
      operationId: getMe
      summary: Get the caller's profile.
      tags:
        - profile
      security:
        - supabaseJwt: []
      x-phase: 2
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
                required:
                  - profile
                additionalProperties: false
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateMe
      summary: Create or update profile fields during onboarding. City is resolved server-side from cityId.
      tags:
        - profile
      security:
        - supabaseJwt: []
      x-phase: 2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
                required:
                  - profile
                additionalProperties: false
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/geocode:
    get:
      operationId: geocode
      summary: Search for a city. The user picks one and sends its id as cityId.
      tags:
        - profile
      security:
        - supabaseJwt: []
      x-phase: 2
      parameters:
        - schema:
            type: string
            minLength: 2
            maxLength: 80
            description: City name to search for. Plain text, 2 to 80 characters after cleaning.
          required: true
          description: City name to search for. Plain text, 2 to 80 characters after cleaning.
          name: q
          in: query
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeResults"
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: provider_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/avatar:
    get:
      operationId: getAvatar
      summary: Get the caller's look, trait form, and avatars (one per style).
      tags:
        - avatar
      security:
        - supabaseJwt: []
      x-phase: 4
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarState"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAvatar
      summary: Generate and save the caller's avatar in a style, from their stored look (or new traits) and optionally their photo. Waits for the image. Calling it again regenerates (capped).
      tags:
        - avatar
      security:
        - supabaseJwt: []
      x-phase: 4
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvatarRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAvatarResponse"
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: content_blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: quota_exceeded, rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: provider_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/avatar/photo:
    post:
      operationId: uploadAvatarPhoto
      summary: Upload a photo for your own avatar, with consent. Moderated, re-encoded, metadata stripped, and deleted within an hour. Returns a photoUrl for POST /api/avatar.
      tags:
        - avatar
      security:
        - supabaseJwt: []
      x-phase: 4
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AvatarPhotoUpload"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarPhotoResponse"
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: payload_too_large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: unsupported_media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: content_blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/papers:
    get:
      operationId: listPapers
      summary: List papers the caller belongs to.
      tags:
        - papers
      security:
        - supabaseJwt: []
      x-phase: 2
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  papers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Paper"
                required:
                  - papers
                additionalProperties: false
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createPaper
      summary: Create a paper. The caller becomes its owner.
      tags:
        - papers
      security:
        - supabaseJwt: []
      x-phase: 2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaperRequest"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paper:
                    $ref: "#/components/schemas/Paper"
                required:
                  - paper
                additionalProperties: false
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/papers/{paperId}:
    get:
      operationId: getPaper
      summary: Get a paper and its contributor list.
      tags:
        - papers
      security:
        - supabaseJwt: []
      x-phase: 2
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: paperId
          in: path
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paper:
                    $ref: "#/components/schemas/PaperDetail"
                required:
                  - paper
                additionalProperties: false
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updatePaper
      summary: Rename a paper or change its art style. Owner only.
      tags:
        - papers
      security:
        - supabaseJwt: []
      x-phase: 2
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: paperId
          in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaperRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paper:
                    $ref: "#/components/schemas/Paper"
                required:
                  - paper
                additionalProperties: false
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/papers/{paperId}/invites:
    get:
      operationId: listInvites
      summary: List invites. Owner only. Codes are never returned after creation.
      tags:
        - invites
      security:
        - supabaseJwt: []
      x-phase: 2
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: paperId
          in: path
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
                required:
                  - invites
                additionalProperties: false
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
