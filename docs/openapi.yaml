      summary: Liveness check.
      tags:
        - system
      security: []
      x-phase: 0
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Health"
                required:
                  - data
                additionalProperties: false
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/me:
    get:
      operationId: getMe
      summary: Get the caller's profile.
      tags:
        - profile
      security:
        - supabaseJwt: []
      x-phase: 2
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      profile:
                        $ref: "#/components/schemas/Profile"
                    required:
                      - profile
                    additionalProperties: false
                required:
                  - data
                additionalProperties: false
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
