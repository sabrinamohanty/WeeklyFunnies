        error:
          $ref: "#/components/schemas/GenerationError"
      required:
        - status
        - url
        - error
      additionalProperties: false
      description: Show a loading state while pending or generating, and a retry on failed.
    GenerationStatus:
      type: string
      enum:
        - pending
        - generating
        - ready
        - failed
    GenerationError:
      type:
        - string
        - "null"
      enum:
        - generation_failed
        - content_blocked
        - provider_unavailable
        - null
    SaveEditionRequest:
      type: object
      properties:
        saved:
          type: boolean
          description: true keeps it forever; false restores the 14-day expiry.
      required:
        - saved
      additionalProperties: false
    ReactionResult:
      type: object
      properties:
        reactions:
          $ref: "#/components/schemas/ReactionCounts"
        myReaction:
          $ref: "#/components/schemas/Reaction"
      required:
        - reactions
        - myReaction
      additionalProperties: false
    SetReactionRequest:
      type: object
      properties:
        reaction:
          type:
            - string
            - "null"
          enum:
            - ha
            - aww
            - hooray
            - null
          description: null removes your reaction.
      required:
        - reaction
      additionalProperties: false
    PagePaper:
      type: object
      properties:
        paperId:
          type: string
          format: uuid
        paperName:
          type: string
        editionId:
          type: string
          format: uuid
        deadline:
          type: string
          format: date-time
          description: Sunday 11:59 p.m. in that paper owner's timezone.
      required:
        - paperId
        - paperName
        - editionId
        - deadline
      additionalProperties: false
    PageStatus:
      type: string
      enum:
        - writing
        - generated
        - approved
      description: "writing: highlights only. generated: stories and comic exist. approved: the author signed off; any edit returns it to generated."
    Highlight:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pageId:
          type: string
          format: uuid
        text:
          type: string
          description: What the author wrote. Only returned to the author.
        serious:
          type: boolean
        inComic:
          type: boolean
        position:
          type: integer
          minimum: 0
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
          maxItems: 4
        notices:
          type: array
          items:
            $ref: "#/components/schemas/HighlightNotice"
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp.
      required:
        - id
        - pageId
        - text
        - serious
        - inComic
        - position
        - photos
        - notices
        - createdAt
        - updatedAt
      additionalProperties: false
    Photo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        highlightId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Short-lived signed URL. Do not cache past urlsExpireAt.
        width:
          type: integer
          exclusiveMinimum: 0
        height:
          type: integer
          exclusiveMinimum: 0
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp.
      required:
        - id
        - highlightId
        - url
        - width
        - height
        - createdAt
      additionalProperties: false
    HighlightNotice:
      type: string
      enum:
        - marked_serious
      description: "marked_serious: moderation flagged the topic as sensitive, so serious was turned on and inComic off. Serious highlights get a gentle story and never appear in the comic."
    Story:
      type: object
      properties:
        id:
          type: string
          format: uuid
        highlightId:
          type: string
          format: uuid
        section:
          $ref: "#/components/schemas/StorySection"
        headline:
          type: string
          description: At most 120 characters.
        body:
          type: string
          description: One to three sentences, plain text.
        photos:
          type: array
          items:
            type: string
            format: uri
            description: Short-lived signed URL. Do not cache past urlsExpireAt.
          maxItems: 4
          description: The highlight's photos. Show a count badge and open them in the lightbox.
      required:
        - id
        - highlightId
        - section
        - headline
        - body
        - photos
      additionalProperties: false
    PageNotice:
      type: string
      enum:
        - fallback_used
        - stale
      description: "fallback_used: generation failed validation, so safe default text was used; edit or regenerate. stale: highlights changed after generation; regenerate before approving."
    Page:
      type: object
      properties:
        id:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
          description: Monday of the page's week.
        weekEnd:
          type: string
          format: date
          description: Calendar date, YYYY-MM-DD.
        deadline:
          type: string
          format: date-time
          description: The earliest deadline among the linked papers.
        locked:
          type: boolean
          description: True once the deadline has passed. Nothing can change.
        style:
          type: string
          enum:
            - classic
            - manga
            - sketch
            - superhero
          description: The author's style when the comic was generated.
        papers:
          type: array
          items:
            $ref: "#/components/schemas/PagePaper"
          maxItems: 10
        status:
          $ref: "#/components/schemas/PageStatus"
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/Highlight"
          maxItems: 3
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
          maxItems: 3
          description: In highlight order.
        comic:
          type:
            - object
            - "null"
          properties:
            title:
              type: string
            panels:
              type: array
              items:
                $ref: "#/components/schemas/Panel"
              description: In display order.
          required:
            - title
            - panels
          additionalProperties: false
          description: Null before generation, or when every highlight is serious.
        notices:
          type: array
          items:
            $ref: "#/components/schemas/PageNotice"
        limits:
          type: object
          properties:
            regenerationsLeft:
              type: integer
              minimum: 0
            rewritesLeft:
              type: integer
              minimum: 0
            redrawsLeft:
              type: integer
              minimum: 0
          required:
            - regenerationsLeft
            - rewritesLeft
            - redrawsLeft
          additionalProperties: false
        generatedAt:
          type:
            - string
            - "null"
          format: date-time
          description: ISO 8601 timestamp.
        approvedAt:
          type:
            - string
            - "null"
          format: date-time
          description: ISO 8601 timestamp.
        urlsExpireAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp.
      required:
        - id
        - weekStart
        - weekEnd
        - deadline
        - locked
        - style
        - papers
        - status
        - highlights
        - stories
        - comic
        - notices
        - limits
        - generatedAt
        - approvedAt
        - urlsExpireAt
      additionalProperties: false
      description: Only ever returned to its author.
    SetPagePapersRequest:
      type: object
      properties:
        paperIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 10
          description: Papers you belong to whose current edition is still open.
      required:
        - paperIds
      additionalProperties: false
    UpdatePageRequest:
      type: object
      properties:
        stories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              headline:
                type: string
                minLength: 1
                maxLength: 120
                description: Plain text, 1 to 120 characters after cleaning.
              body:
                type: string
                minLength: 1
                maxLength: 600
                description: Plain text, 1 to 600 characters after cleaning.
            required:
              - id
            additionalProperties: false
          maxItems: 3
        comic:
          type: object
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 80
              description: Plain text, 1 to 80 characters after cleaning.
            panels:
              type: array
              items:
                type: object
                properties:
                  index:
                    type: integer
                    minimum: 0
                    maximum: 3
                  caption:
                    type:
                      - string
                      - "null"
                    minLength: 1
                    maxLength: 120
                    description: Caption. At most 15 words. Plain text, 1 to 120 characters after cleaning.
                  dialogue:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          minLength: 1
                          maxLength: 100
                          description: Dialogue line. At most 12 words. Plain text, 1 to 100 characters after cleaning.
                      required:
                        - text
                      additionalProperties: false
                    maxItems: 2
                    description: Replaces the text of the existing lines in order; sides are kept.
                required:
                  - index
                additionalProperties: false
              maxItems: 4
          additionalProperties: false
      additionalProperties: false
      description: Edited text is moderated. Clears approval.
    CreateHighlightRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: The highlight, in the author's words. Plain text, 1 to 500 characters after cleaning.
        serious:
          type: boolean
          default: false
        inComic:
          type: boolean
          default: true
          description: Ignored (forced off) when serious is true.
      required:
        - text
      additionalProperties: false
    ReorderHighlightsRequest:
      type: object
      properties:
        highlightIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 3
          description: All of the page's highlight ids, in the new order.
      required:
        - highlightIds
      additionalProperties: false
    GeneratePageRequest:
      type: object
      properties:
        regenerate:
          type: boolean
          default: false
          description: Write new stories and a new comic even if they exist. Resets panel images. Limited.
      additionalProperties: false
    DrawPanelRequest:
      type: object
      properties:
        regenerate:
          type: boolean
          default: false
          description: Draw a new image even if one is ready. Counts toward the page and daily caps.
      additionalProperties: false
    ReorderPanelsRequest:
      type: object
      properties:
        order:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 3
          description: Current panel indexes in their new order, e.g. [1, 0, 2, 3].
      required:
        - order
      additionalProperties: false
    UpdateHighlightRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: The highlight, in the author's words. Plain text, 1 to 500 characters after cleaning.
        serious:
          type: boolean
        inComic:
          type: boolean
      additionalProperties: false
      description: Any change marks a generated page stale and clears its approval.
    Deleted:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deleted:
          type: boolean
          enum:
            - true
      required:
        - id
        - deleted
      additionalProperties: false
    PhotoUpload:
      type: object
      properties:
        photo:
          type: string
          format: binary
          description: JPEG or PNG, at most 12 MB. Moderated, re-encoded server-side; all metadata is stripped.
      additionalProperties: false
    LogoutResult:
      type: object
      properties:
        signedOut:
          type: boolean
          enum:
            - true
          description: All sessions on all devices were revoked.
        purgeAfter:
          type: string
          format: date-time
          description: Draft posts are hidden now and deleted after this time unless the user signs back in. Posts in published editions follow the edition's expiry instead.
      required:
        - signedOut
        - purgeAfter
      additionalProperties: false
    CronResult:
      type: object
      properties:
        processed:
          type: integer
          minimum: 0
      required:
        - processed
      additionalProperties: false
  parameters: {}
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness check.
      tags:
        - system
      security: []
      x-phase: 0
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/me:
    get:
      operationId: getMe
      summary: Get the caller's profile.
      tags:
        - profile
      security:
        - supabaseJwt: []
      x-phase: 2
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
                required:
                  - profile
                additionalProperties: false
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateMe
      summary: Create or update profile fields during onboarding. City is resolved server-side from cityId.
      tags:
        - profile
      security:
        - supabaseJwt: []
      x-phase: 2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
                required:
                  - profile
                additionalProperties: false
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/geocode:
    get:
      operationId: geocode
      summary: Search for a city. The user picks one and sends its id as cityId.
      tags:
        - profile
      security:
        - supabaseJwt: []
      x-phase: 2
      parameters:
        - schema:
            type: string
            minLength: 2
            maxLength: 80
            description: City name to search for. Plain text, 2 to 80 characters after cleaning.
          required: true
          description: City name to search for. Plain text, 2 to 80 characters after cleaning.
          name: q
          in: query
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeResults"
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: provider_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/weather:
    get:
      operationId: getWeather
      summary: 7-day forecast for the browser's location if given (rounded, never stored), else the profile city.
      tags:
        - profile
      security:
        - supabaseJwt: []
      x-phase: 5
      parameters:
        - schema:
            type: string
            maxLength: 20
            pattern: ^-?\d{1,3}(\.\d+)?$
          required: false
          name: lat
          in: query
        - schema:
            type: string
            maxLength: 20
            pattern: ^-?\d{1,3}(\.\d+)?$
          required: false
          name: lon
          in: query
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  weather:
                    type:
                      - object
                      - "null"
                    properties:
                      source:
                        type: string
                        enum:
                          - location
                          - profile_city
                      place:
                        type:
                          - string
                          - "null"
                        description: The profile city's name. Null for browser location; label it on the client.
                      timezone:
                        type: string
                      fetchedAt:
                        type: string
                        format: date-time
                        description: ISO 8601 timestamp.
                      current:
                        type:
                          - object
                          - "null"
                        properties:
                          tempC:
                            type: number
                          weatherCode:
                            type: integer
                            description: WMO weather interpretation code.
                          summary:
                            type: string
                        required:
                          - tempC
                          - weatherCode
                          - summary
                        additionalProperties: false
                      days:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                              description: Calendar date, YYYY-MM-DD.
                            tempMaxC:
                              type: number
                            tempMinC:
                              type: number
                            precipitationChance:
                              type:
                                - integer
                                - "null"
                              minimum: 0
                              maximum: 100
                            weatherCode:
                              type: integer
                              description: WMO weather interpretation code.
                            summary:
                              type: string
                              description: Short label for the code, e.g. 'Light rain'.
                          required:
                            - date
                            - tempMaxC
                            - tempMinC
                            - precipitationChance
                            - weatherCode
                            - summary
                          additionalProperties: false
                        maxItems: 7
                    required:
                      - source
                      - place
                      - timezone
                      - fetchedAt
                      - current
                      - days
                    additionalProperties: false
                    description: Null when there's no location and no profile city.
                required:
                  - weather
                additionalProperties: false
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: provider_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/avatar:
    get:
      operationId: getAvatar
      summary: Get the caller's style, look, trait form, and avatar.
      tags:
        - avatar
      security:
        - supabaseJwt: []
      x-phase: 4
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarState"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAvatar
      summary: Draw the caller's avatar in their style (optionally switching style first), from their stored look or new traits, and optionally their photo. Waits for the image. Calling again redraws (capped).
      tags:
        - avatar
      security:
        - supabaseJwt: []
      x-phase: 4
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvatarRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAvatarResponse"
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: content_blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: quota_exceeded, rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: provider_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/avatar/photo:
    post:
      operationId: uploadAvatarPhoto
      summary: Upload a photo for your own avatar, with consent. Moderated, re-encoded, metadata stripped, and deleted within an hour. Returns a photoUrl for POST /api/avatar.
      tags:
        - avatar
      security:
        - supabaseJwt: []
      x-phase: 4
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AvatarPhotoUpload"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarPhotoResponse"
        "400":
          description: bad_request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: payload_too_large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: unsupported_media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: content_blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/papers:
    get:
      operationId: listPapers
      summary: List papers the caller belongs to.
      tags:
        - papers
      security:
        - supabaseJwt: []
      x-phase: 2
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  papers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Paper"
                required:
                  - papers
                additionalProperties: false
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate_limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createPaper
      summary: Create a paper. The caller becomes its owner.
      tags:
        - papers
      security:
        - supabaseJwt: []
      x-phase: 2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaperRequest"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paper:
                    $ref: "#/components/schemas/Paper"
                required:
                  - paper
                additionalProperties: false
        "400":
          description: bad_request
          content:
            application/json:
